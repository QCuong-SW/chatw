version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: chatapp_mongodb
    restart: always
    volumes:
      - mongo_data:/data/db
    networks:
      - chatapp_net

  redis:
    image: redis:7-alpine
    container_name: chatapp_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - chatapp_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: chatapp_server
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/chatapp
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=chatapp_secret_jwt_super_key_2026
      - JWT_EXPIRES_IN=1d
      - REFRESH_SECRET=chatapp_refresh_jwt_super_key_2026
      - REFRESH_EXPIRES_IN=7d
      - CLOUDINARY_CLOUD_NAME=gwxzzptn
      - CLOUDINARY_API_KEY=319363467223388
      - CLOUDINARY_API_SECRET=Pa-_Sf3RIvom1aE7Gx7OoNKZAiA
    depends_on:
      - mongodb
      - redis
    networks:
      - chatapp_net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=/api
        - NEXT_PUBLIC_SOCKET_URL=/
    container_name: chatapp_client
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=/api
      - NEXT_PUBLIC_SOCKET_URL=/
    depends_on:
      - server
    networks:
      - chatapp_net

  nginx:
    image: nginx:alpine
    container_name: chatapp_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - client
      - server
    networks:
      - chatapp_net

networks:
  chatapp_net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
